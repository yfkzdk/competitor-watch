<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博监控 // 竞品详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="/static/cyberpunk.css">
    <style>
        /* === COMPETITOR MATRIX TABLE === */
        .matrix-table { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:12px; }
        .matrix-table th { text-align:left; padding:10px 14px; color:var(--neon-cyan); border-bottom:2px solid var(--neon-cyan); font-weight:600; letter-spacing:1px; text-transform:uppercase; font-size:10px; white-space:nowrap; }
        .matrix-table td { padding:10px 14px; border-bottom:1px solid rgba(26,26,62,.4); color:var(--text-primary); }
        .matrix-table tr:hover td { background:rgba(0,255,240,.03); }
        .matrix-table .active-row td { background:rgba(0,255,240,.06); border-left:3px solid var(--neon-cyan); }
        .matrix-table .val-up { color:var(--neon-green); }
        .matrix-table .val-down { color:var(--neon-magenta); }
        .matrix-table .val-stable { color:var(--neon-amber); }
        .matrix-badge { display:inline-block; padding:2px 8px; border-radius:2px; font-size:10px; font-weight:600; letter-spacing:0.5px; }
        .matrix-badge.rising { color:var(--neon-green); border:1px solid var(--neon-green); background:rgba(5,255,161,.08); }
        .matrix-badge.falling { color:var(--neon-magenta); border:1px solid var(--neon-magenta); background:rgba(255,42,109,.08); }
        .matrix-badge.stable { color:var(--neon-amber); border:1px solid var(--neon-amber); background:rgba(240,224,0,.08); }
        .matrix-badge.insufficient { color:var(--text-dim); border:1px solid var(--text-dim); }
        .matrix-badge.warning { color:var(--neon-magenta); border:1px solid var(--neon-magenta); background:rgba(255,42,109,.08); }
        .matrix-badge.ok { color:var(--neon-green); border:1px solid var(--neon-green); background:rgba(5,255,161,.08); }
        .clickable-row { cursor:pointer; transition:background .15s; }

        /* === CHANGE FEED === */
        .change-feed { display:flex; flex-direction:column; gap:0; max-height:400px; overflow-y:auto; }
        .change-entry { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid rgba(26,26,62,.4); font-family:var(--font-mono); font-size:11px; transition:background .15s; }
        .change-entry:hover { background:rgba(0,255,240,.03); }
        .change-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        .change-dot.up { background:var(--neon-green); box-shadow:0 0 6px var(--neon-green); }
        .change-dot.down { background:var(--neon-magenta); box-shadow:0 0 6px var(--neon-magenta); }
        .change-dot.no-change { background:var(--text-dim); }
        .change-time { color:var(--text-dim); min-width:90px; }
        .change-detail { color:var(--text-primary); flex:1; }
        .change-diff { font-weight:600; }
        .change-diff.up { color:var(--neon-green); }
        .change-diff.down { color:var(--neon-magenta); }

        /* === METRIC CARDS === */
        .metric-card { position:relative; background:var(--bg-panel); border:1px solid var(--border-dim); padding:16px 20px; overflow:hidden; transition:border-color .3s,box-shadow .3s; }
        .metric-card::before { content:''; position:absolute; top:0; left:0; width:3px; height:100%; background:var(--card-accent,var(--neon-cyan)); }
        .metric-card:hover { border-color:var(--card-accent,var(--border-glow)); box-shadow:0 0 20px rgba(0,255,240,.08); }
        .metric-card .metric-label { font-family:var(--font-mono); font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
        .metric-card .metric-value { font-family:var(--font-mono); font-size:28px; font-weight:700; color:var(--card-accent,var(--text-data)); text-shadow:0 0 12px rgba(0,255,240,.25); line-height:1; }
        .metric-card .metric-sub { font-family:var(--font-mono); font-size:11px; color:var(--text-dim); margin-top:4px; }
        .metric-card .metric-trend { font-family:var(--font-mono); font-size:12px; font-weight:600; }
        .metric-card .metric-trend.up { color:var(--neon-green); }
        .metric-card .metric-trend.down { color:var(--neon-magenta); }
        .metric-card .metric-trend.stable { color:var(--neon-amber); }

        /* === CHART === */
        .chart-container { position:relative; width:100%; height:320px; }
        .chart-container canvas { width:100%!important; height:100%!important; }

        /* === ANOMALY TABLE === */
        .anomaly-table { width:100%; border-collapse:collapse; font-family:var(--font-mono); font-size:11px; }
        .anomaly-table th { text-align:left; padding:8px 10px; color:var(--neon-cyan); border-bottom:1px solid var(--border-dim); font-weight:600; letter-spacing:1px; text-transform:uppercase; font-size:10px; }
        .anomaly-table td { padding:8px 10px; border-bottom:1px solid rgba(26,26,62,.4); color:var(--text-primary); }
        .anomaly-table tr:hover td { background:rgba(0,255,240,.03); }

        /* === CORR CELL === */
        .corr-cell { display:inline-flex; align-items:center; justify-content:center; width:48px; height:48px; font-family:var(--font-mono); font-size:10px; font-weight:600; border:1px solid var(--border-dim); margin:1px; transition:transform .15s,box-shadow .15s; cursor:default; }
        .corr-cell:hover { transform:scale(1.15); box-shadow:0 0 12px rgba(0,255,240,.3); z-index:1; }

        /* === DIFF VIEW === */
        .diff-entry { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:1px solid rgba(26,26,62,.4); font-family:var(--font-mono); font-size:11px; }
        .diff-entry:hover { background:rgba(0,255,240,.03); }
        .diff-badge { font-family:var(--font-mono); font-size:10px; padding:2px 8px; border:1px solid; border-radius:2px; }
        .diff-badge.added { color:var(--neon-green); border-color:var(--neon-green); }
        .diff-badge.removed { color:var(--neon-magenta); border-color:var(--neon-magenta); }
        .diff-badge.changed { color:var(--neon-amber); border-color:var(--neon-amber); }

        /* === AUTO REFRESH === */
        .auto-refresh-indicator { display:flex; align-items:center; gap:6px; font-family:var(--font-mono); font-size:10px; color:var(--text-dim); cursor:pointer; }
        .auto-refresh-indicator .dot { width:6px; height:6px; border-radius:50%; background:var(--neon-green); animation:data-pulse 2s ease-in-out infinite; }
        .auto-refresh-indicator.paused .dot { background:var(--text-dim); animation:none; }

        /* === SKELETON === */
        .sk-panel { background:var(--bg-panel); border:1px solid rgba(26,26,62,.4); padding:16px 20px; overflow:hidden; }
        .sk-bar { background:linear-gradient(90deg, rgba(106,106,142,.15) 0%, rgba(0,255,240,.08) 50%, rgba(106,106,142,.15) 100%); background-size:200% 100%; animation:sk-shimmer 1.8s ease-in-out infinite; border-radius:2px; }
        @keyframes sk-shimmer { 0%, 100% { background-position:200% 0; } 50% { background-position:-200% 0; } }

        /* === FRESHNESS BADGE === */
        .freshness-badge { display:inline-flex; align-items:center; gap:5px; font-family:var(--font-mono); font-size:10px; letter-spacing:1px; padding:4px 10px; border:1px solid; border-radius:2px; }
        .freshness-badge.fresh { color:var(--neon-green); border-color:var(--neon-green); background:rgba(5,255,161,.06); }
        .freshness-badge.stale { color:var(--neon-amber); border-color:var(--neon-amber); }

        /* === NUMBER ROLL === */
        .metric-value { transition:color .3s; }
        .metric-value.roll { animation: roll-in .5s cubic-bezier(.34,1.56,.64,1); }
        @keyframes roll-in { 0% { transform:translateY(8px); opacity:0; } 100% { transform:translateY(0); opacity:1; } }

        /* === COMPETITOR SELECTOR === */
        .competitor-switcher select { background:var(--bg-void); border:1px solid var(--neon-cyan); color:var(--neon-cyan); font-family:var(--font-mono); font-size:12px; padding:4px 12px; outline:none; cursor:pointer; min-width:160px; }
        .competitor-switcher select:focus { box-shadow:0 0 8px rgba(0,255,240,.3); }

        /* === TIME RANGE === */
        .time-range-bar button { font-family:var(--font-mono); font-size:11px; padding:4px 12px; background:transparent; color:var(--text-dim); border:1px solid var(--border-dim); cursor:pointer; transition:all .2s; letter-spacing:1px; }
        .time-range-bar button:hover { color:var(--neon-cyan); border-color:var(--neon-cyan); }
        .time-range-bar button.active { color:var(--neon-cyan); border-color:var(--neon-cyan); background:rgba(0,255,240,.08); box-shadow:0 0 8px rgba(0,255,240,.15); }
    </style>
</head>
<body>
<div id="app">

    <!-- TOPBAR -->
    <header class="cyber-topbar">
        <div class="cyber-brand">
            <h1>赛博监控</h1>
            <span class="version">v2.1 // {{ competitorName || '选择竞品' }}</span>
        </div>
        <nav class="cyber-nav">
            <span :class="['freshness-badge', dataFreshness.stale ? 'stale' : 'fresh']">
                <span style="width:5px;height:5px;border-radius:50%;display:inline-block;" :style="{ background: dataFreshness.stale ? 'var(--neon-amber)' : 'var(--neon-green)' }"></span>
                {{ dataFreshness.text }}
            </span>
            <a href="/">首页</a>
            <a href="/alerts">告警中心</a>
            <a href="/report">分析报告</a>
            <a href="/monitoring/dashboard">监控台</a>
        </nav>
    </header>

    <!-- TAB NAV + CONTROLS -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 24px;border-bottom:1px solid var(--border-dim);background:var(--bg-panel);flex-wrap:wrap;gap:8px;">
        <div class="cyber-nav">
            <button v-for="tab in tabs" :key="tab.key" :class="{ active: currentTab === tab.key }" @click="switchTab(tab.key)">{{ tab.label }}</button>
        </div>
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
            <div class="competitor-switcher">
                <span style="font-family:var(--font-mono);font-size:10px;color:var(--text-dim);letter-spacing:1px;">竞品</span>
                <select v-model="competitorId" @change="onCompetitorChange">
                    <option v-for="c in competitors" :key="c.id" :value="c.id">{{ c.name }}</option>
                </select>
            </div>
            <div class="time-range-bar">
                <button v-for="r in ['7','30','90']" :key="r" :class="{ active: timeRange === r }" @click="setTimeRange(r)">{{ r }}天</button>
            </div>
            <div class="auto-refresh-indicator" :class="{ paused: !autoRefresh }" @click="toggleAutoRefresh">
                <div class="dot"></div>
                <span>{{ autoRefresh ? refreshInterval + 's' : '暂停' }}</span>
            </div>
        </div>
    </div>

    <!-- LOADING SKELETON -->
    <div v-if="loading" style="padding:20px 24px;">
        <!-- Skeleton header -->
        <div style="display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;">
            <div v-for="i in 4" :key="'sk-tab-'+i" class="sk-bar" style="width:80px;height:28px;border-radius:2px;"></div>
        </div>
        <!-- Skeleton metric cards -->
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px;">
            <div v-for="i in 5" :key="'sk-card-'+i" class="sk-panel" style="height:96px;">
                <div class="sk-bar" style="width:60%;height:10px;margin-bottom:12px;"></div>
                <div class="sk-bar" style="width:40%;height:24px;margin-bottom:6px;"></div>
                <div class="sk-bar" style="width:30%;height:10px;"></div>
            </div>
        </div>
        <!-- Skeleton chart + table -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px;">
            <div class="sk-panel" style="height:300px;">
                <div class="sk-bar" style="width:120px;height:12px;margin-bottom:16px;"></div>
                <div class="sk-bar" style="width:100%;height:240px;border-radius:4px;"></div>
            </div>
            <div class="sk-panel" style="height:300px;">
                <div class="sk-bar" style="width:120px;height:12px;margin-bottom:16px;"></div>
                <div class="sk-bar" style="width:100%;height:240px;border-radius:4px;"></div>
            </div>
        </div>
        <!-- Skeleton bottom row -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="sk-panel" style="height:280px;">
                <div class="sk-bar" style="width:100px;height:12px;margin-bottom:16px;"></div>
                <div class="sk-bar" style="width:100%;height:220px;border-radius:4px;"></div>
            </div>
            <div class="sk-panel" style="height:280px;">
                <div class="sk-bar" style="width:100px;height:12px;margin-bottom:16px;"></div>
                <div class="sk-bar" style="width:100%;height:220px;border-radius:4px;"></div>
            </div>
        </div>
    </div>

    <!-- ERROR -->
    <div v-else-if="error" class="cyber-panel" style="border-color:var(--neon-magenta);margin:24px;">
        <div class="cyber-panel-header"><span class="cyber-panel-title" style="color:var(--neon-magenta);">加载失败</span></div>
        <div class="cyber-panel-body">
            <p style="font-family:var(--font-mono);font-size:13px;margin-bottom:16px;">{{ error }}</p>
            <button class="cyber-btn cyber-btn-danger" @click="loadData">重试</button>
        </div>
    </div>

    <!-- CONTENT -->
    <template v-else>
        <main style="padding:20px 24px;">

            <!-- ===== OVERVIEW: MATRIX + FEED + METRICS ===== -->
            <div v-if="currentTab === 'overview'">

                <!-- Competitor Matrix -->
                <div class="cyber-panel" style="margin-bottom:16px;">
                    <div class="cyber-panel-header">
                        <span class="cyber-panel-title">竞品对比矩阵</span>
                        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">{{ competitors.length }} 个竞品</span>
                    </div>
                    <div class="cyber-panel-body" style="overflow-x:auto;">
                        <table class="matrix-table">
                            <thead>
                                <tr>
                                    <th>竞品</th>
                                    <th>价格指数</th>
                                    <th>趋势</th>
                                    <th>变化率</th>
                                    <th>异常</th>
                                    <th>评分</th>
                                    <th>市场份额</th>
                                    <th>快照</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="c in competitorSummaries" :key="c.id"
                                    :class="{ 'active-row': c.id === competitorId }"
                                    class="clickable-row"
                                    @click="selectCompetitor(c.id)">
                                    <td style="font-weight:600;color:var(--text-data);">{{ c.name }}</td>
                                    <td style="font-weight:600;">{{ formatNumber(c.priceIndex, 1) }}</td>
                                    <td><span :class="['matrix-badge', c.trend]">{{ trendLabel(c.trend) }}</span></td>
                                    <td :class="c.changePct > 0 ? 'val-up' : c.changePct < 0 ? 'val-down' : 'val-stable'">{{ c.changePct != null ? (c.changePct > 0 ? '+' : '') + formatNumber(c.changePct, 1) + '%' : '-' }}</td>
                                    <td><span :class="['matrix-badge', c.anomalyCount > 0 ? 'warning' : 'ok']">{{ c.anomalyCount }}</span></td>
                                    <td>{{ c.rating }}</td>
                                    <td>{{ (c.marketShare * 100).toFixed(0) }}%</td>
                                    <td style="color:var(--text-dim);">{{ c.snapshots }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Posture Radar -->
                <div class="cyber-panel" style="margin-bottom:16px;">
                    <div class="cyber-panel-header">
                        <span class="cyber-panel-title">竞争态势雷达</span>
                        <div style="display:flex;align-items:center;gap:12px;font-family:var(--font-mono);font-size:10px;">
                            <label v-for="p in postureScores" :key="p.competitor_id" style="display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--text-dim);">
                                <input type="checkbox" :value="p.competitor_id" v-model="postureVisible" @change="renderPostureRadar()" :style="{ accentColor: postureColors[p.competitor_id] || '#00fff0' }">
                                {{ p.name }}
                            </label>
                        </div>
                    </div>
                    <div class="cyber-panel-body"><div class="chart-container" style="height:380px;"><canvas id="postureRadarChart"></canvas></div></div>
                </div>

                <!-- Metric Cards -->
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px;">
                    <div class="metric-card" style="--card-accent:var(--neon-cyan);">
                        <div class="metric-label">最新价格</div>
                        <div class="metric-value roll" :key="dataVersion + '-p'">{{ formatNumber(metrics.latestPrice) }}</div>
                        <div class="metric-sub">CNY</div>
                    </div>
                    <div class="metric-card" style="--card-accent:var(--neon-amber);">
                        <div class="metric-label">价格变化</div>
                        <div class="metric-value roll" :key="dataVersion + '-pc'">{{ formatNumber(metrics.priceChange, 1) }}%</div>
                        <div class="metric-trend" :class="metrics.priceChange > 0 ? 'up' : metrics.priceChange < 0 ? 'down' : 'stable'">{{ metrics.priceChange > 0 ? '↑ 上涨' : metrics.priceChange < 0 ? '↓ 下跌' : '→ 持平' }}</div>
                    </div>
                    <div class="metric-card" style="--card-accent:var(--neon-magenta);">
                        <div class="metric-label">异常检测</div>
                        <div class="metric-value roll" :key="dataVersion + '-a'">{{ metrics.anomalyCount }}</div>
                        <div class="metric-sub">近{{ timeRange }}天</div>
                    </div>
                    <div class="metric-card" style="--card-accent:var(--neon-green);">
                        <div class="metric-label">趋势</div>
                        <div class="metric-value roll" :key="dataVersion + '-t'" style="font-size:22px;">{{ trendArrow }}</div>
                        <div class="metric-trend" :class="metrics.trendDirection === 'rising' ? 'up' : metrics.trendDirection === 'falling' ? 'down' : 'stable'">{{ trendText }}</div>
                    </div>
                    <div class="metric-card" style="--card-accent:var(--neon-purple);">
                        <div class="metric-label">情感分数</div>
                        <div class="metric-value roll" :key="dataVersion + '-s'">{{ formatNumber(metrics.avgSentiment, 2) }}</div>
                        <div class="metric-sub">{{ metrics.totalReviews }} 条评论</div>
                    </div>
                </div>

                <!-- Price Trend + Change Feed -->
                <div class="cyber-grid-2" style="margin-bottom:16px;">
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">价格走势</span>
                        </div>
                        <div class="cyber-panel-body">
                            <div class="chart-container"><canvas id="priceTrendChart"></canvas></div>
                        </div>
                    </div>
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">变化动态</span>
                            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">{{ diffTimeline.length }} 条</span>
                        </div>
                        <div class="cyber-panel-body" style="max-height:380px;overflow-y:auto;">
                            <div v-if="diffTimeline.length === 0" class="cyber-empty">暂无变化记录</div>
                            <div v-else class="change-feed">
                                <div v-for="e in diffTimeline" :key="e.timestamp + e.hash" class="change-entry">
                                    <div :class="['change-dot', e.dotClass]"></div>
                                    <span class="change-time">{{ formatTimestamp(e.timestamp) }}</span>
                                    <span class="change-detail">
                                        <span v-if="e.field_name" style="color:var(--neon-cyan);">{{ e.field_name }}: </span>
                                        <template v-if="e.diffs && e.diffs.length">
                                            <span v-for="(d, di) in e.diffs" :key="di">
                                                <span v-if="d.type === 'removed'" style="color:var(--neon-magenta);text-decoration:line-through;">{{ d.text }}</span>
                                                <span v-else-if="d.type === 'added'" style="color:var(--neon-green);font-weight:600;">{{ d.text }}</span>
                                                <span v-else>{{ d.text }}</span>
                                            </span>
                                        </template>
                                        <template v-else>无变化</template>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sentiment + Monitoring -->
                <div class="cyber-grid-2" style="margin-bottom:16px;">
                    <div class="cyber-panel">
                        <div class="cyber-panel-header"><span class="cyber-panel-title">情感分布</span></div>
                        <div class="cyber-panel-body"><div class="chart-container"><canvas id="sentimentPieChart"></canvas></div></div>
                    </div>
                    <div class="cyber-panel">
                        <div class="cyber-panel-header"><span class="cyber-panel-title">监控统计</span></div>
                        <div class="cyber-panel-body"><div class="chart-container"><canvas id="monitoringFreqChart"></canvas></div></div>
                    </div>
                </div>

                <!-- Sentiment Trend -->
                <div class="cyber-panel" style="margin-bottom:16px;">
                    <div class="cyber-panel-header">
                        <span class="cyber-panel-title">情感趋势</span>
                        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">{{ sectionStatus.sentiment.error || '近' + timeRange + '天' }}</span>
                    </div>
                    <div class="cyber-panel-body"><div class="chart-container" style="height:280px;"><canvas id="sentimentTrendChart"></canvas></div></div>
                </div>
            </div>

            <!-- ===== PRICE ANALYSIS ===== -->
            <div v-if="currentTab === 'price'">
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">价格历史</span>
                            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">{{ competitorName }} · 近{{ timeRange }}天</span>
                        </div>
                        <div class="cyber-panel-body"><div class="chart-container" style="height:380px;"><canvas id="priceHistoryChart"></canvas></div></div>
                    </div>
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">竞品价格对比</span>
                        </div>
                        <div class="cyber-panel-body"><div class="chart-container" style="height:380px;"><canvas id="priceComparisonChart"></canvas></div></div>
                    </div>
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">价格预测</span>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <select v-model="predictionDays" class="cyber-select" style="width:110px;padding:4px 10px;font-size:12px;">
                                    <option :value="7">预测7天</option>
                                    <option :value="14">预测14天</option>
                                    <option :value="30">预测30天</option>
                                </select>
                                <button class="cyber-btn" @click="predictPrice" style="padding:4px 14px;font-size:11px;">开始预测</button>
                            </div>
                        </div>
                        <div class="cyber-panel-body" style="position:relative;">
                            <div v-if="predictionLoading" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,.8);z-index:10;">
                                <span class="cyber-pulse" style="font-family:var(--font-mono);font-size:13px;color:var(--neon-cyan);">预测中...</span>
                            </div>
                            <div class="chart-container" style="height:380px;"><canvas id="pricePredictionChart"></canvas></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== REVIEWS ===== -->
            <div v-if="currentTab === 'reviews'">
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <div class="cyber-grid-2">
                        <div class="cyber-panel">
                            <div class="cyber-panel-header"><span class="cyber-panel-title">情感分布</span></div>
                            <div class="cyber-panel-body"><div class="chart-container"><canvas id="sentimentDistributionChart"></canvas></div></div>
                        </div>
                        <div class="cyber-panel">
                            <div class="cyber-panel-header"><span class="cyber-panel-title">热门关键词</span></div>
                            <div class="cyber-panel-body"><div class="chart-container"><canvas id="topKeywordsChart"></canvas></div></div>
                        </div>
                    </div>
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">评论列表</span>
                            <select v-model="reviewFilter" class="cyber-select" style="width:100px;padding:4px 10px;font-size:12px;">
                                <option value="all">全部</option>
                                <option value="positive">正面</option>
                                <option value="neutral">中性</option>
                                <option value="negative">负面</option>
                            </select>
                        </div>
                        <div class="cyber-panel-body" style="max-height:500px;overflow-y:auto;">
                            <div v-for="review in filteredReviews" :key="review.id" style="border-bottom:1px solid var(--border-dim);padding:14px 0;">
                                <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                                    <span style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);">{{ review.author || '匿名' }}</span>
                                    <span :class="['cyber-badge', review.sentiment_score > 0.3 ? 'cyber-badge-success' : review.sentiment_score < -0.3 ? 'cyber-badge-error' : 'cyber-badge-p1']">{{ review.sentiment_score > 0.3 ? '正面' : review.sentiment_score < -0.3 ? '负面' : '中性' }}</span>
                                    <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-left:auto;">{{ formatTimestamp(review.review_date) }}</span>
                                </div>
                                <div style="font-family:var(--font-mono);font-size:13px;color:var(--text-primary);line-height:1.6;">{{ review.content }}</div>
                            </div>
                            <div v-if="filteredReviews.length === 0" class="cyber-empty">暂无评论</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== CHANGES (formerly Deep Analysis) ===== -->
            <div v-if="currentTab === 'analytics'">
                <div style="display:flex;flex-direction:column;gap:16px;">
                    <!-- Change Timeline (moved from overview) -->
                    <div class="cyber-panel">
                        <div class="cyber-panel-header">
                            <span class="cyber-panel-title">变化时间线</span>
                            <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);">{{ diffTimeline.length }} 条记录</span>
                        </div>
                        <div class="cyber-panel-body" style="max-height:300px;overflow-y:auto;">
                            <div v-if="diffTimeline.length === 0" class="cyber-empty">暂无变化记录</div>
                            <div v-else class="change-feed">
                                <div v-for="e in diffTimeline" :key="e.timestamp + e.field_name" class="change-entry">
                                    <div :class="['change-dot', e.change_type === 'price_up' ? 'up' : e.change_type === 'price_down' ? 'down' : 'no-change']"></div>
                                    <span class="change-time">{{ formatTimestamp(e.timestamp) }}</span>
                                    <span class="change-detail">
                                        {{ e.field_name }}:
                                        <span :class="['change-diff', e.change_type === 'price_up' ? 'up' : 'down']">{{ e.old_value }} → {{ e.new_value }}</span>
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="cyber-grid-2">
                        <div class="cyber-panel">
                            <div class="cyber-panel-header">
                                <span class="cyber-panel-title">趋势 & 异常检测</span>
                                <span id="trendSummary" style="font-family:var(--font-mono);font-size:11px;color:var(--text-dim);"></span>
                            </div>
                            <div class="cyber-panel-body"><div class="chart-container" style="height:280px;"><canvas id="trendChartCanvas"></canvas></div></div>
                        </div>
                        <div class="cyber-panel">
                            <div class="cyber-panel-header">
                                <span class="cyber-panel-title">异常记录</span>
                                <span style="font-family:var(--font-mono);font-size:11px;color:var(--neon-magenta);">{{ anomalyList.length }} 项</span>
                            </div>
                            <div class="cyber-panel-body" style="max-height:340px;overflow-y:auto;">
                                <table v-if="anomalyList.length > 0" class="anomaly-table">
                                    <thead><tr><th>数值</th><th>Z-score</th><th>时间</th></tr></thead>
                                    <tbody>
                                        <tr v-for="a in anomalyList" :key="a.timestamp + a.value">
                                            <td style="color:var(--text-data);">{{ formatNumber(a.value, 2) }}</td>
                                            <td style="color:var(--neon-amber);">{{ formatNumber(a.z_score, 2) }}</td>
                                            <td style="color:var(--text-dim);">{{ formatTimestamp(a.timestamp) }}</td>
                                        </tr>
                                    </tbody>
                                </table>
                                <div v-else class="cyber-empty" style="padding:40px 0;"><span style="color:var(--neon-green);">未检测到异常</span></div>
                            </div>
                        </div>
                    </div>
                    <div class="cyber-panel">
                        <div class="cyber-panel-header"><span class="cyber-panel-title">竞品相关性矩阵</span></div>
                        <div class="cyber-panel-body">
                            <div id="corrHeatmap" style="display:flex;flex-wrap:wrap;gap:2px;justify-content:center;">
                                <div v-if="correlationMatrix.length === 0" class="cyber-empty">暂无相关性数据</div>
                                <template v-else>
                                    <div v-for="cell in correlationMatrix" :key="cell.competitor_1.id + '-' + cell.competitor_2.id"
                                         class="corr-cell"
                                         :style="{ background: corrColor(cell.correlation), color: Math.abs(cell.correlation) > 0.5 ? '#0a0a0f' : 'var(--text-primary)' }"
                                         :title="cell.competitor_1.name + ' ↔ ' + cell.competitor_2.name + ': ' + cell.correlation">
                                        {{ formatNumber(cell.correlation, 2) }}
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </template>

    <!-- WEBSOCKET STATUS -->
    <div style="position:fixed;bottom:16px;left:16px;font-family:var(--font-mono);font-size:11px;letter-spacing:1px;padding:6px 14px;border:1px solid;"
         :style="{ color: wsConnected ? 'var(--neon-green)' : 'var(--neon-magenta)', borderColor: wsConnected ? 'var(--neon-green)' : 'var(--neon-magenta)', background: wsConnected ? 'rgba(5,255,161,.06)' : 'rgba(255,42,109,.06)' }">
        {{ wsConnected ? '[ONLINE] 实时连接' : '[OFFLINE] 连接断开' }}
    </div>

    <!-- TOAST -->
    <div class="cyber-toast-container">
        <div v-if="notification.show" :class="['cyber-toast', notification.type === 'error' ? 'error' : '']">{{ notification.message }}</div>
    </div>

</div>
<script src="/static/product_detail_v2.js"></script>
</body>
</html>
