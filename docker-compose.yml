# 赛博监控 v2.0 — Docker Compose
# 启动: docker-compose up -d
# 停止: docker-compose down

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: competitor-watch
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=true
      - DATABASE_PATH=/app/data/competitor_watch.db
      - MAX_WORKERS=10
      - RATE_LIMIT_PER_MINUTE=60
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
