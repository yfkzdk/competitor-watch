name: 竞品监控系统 CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - run: |
        python -m pip install --upgrade pip
        pip install ruff
    - run: ruff check app/

  unit-tests:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    - run: |
        python -m pytest app/tests/ \
          -v --tb=short \
          --cov=app --cov-report=xml --cov-report=term \
          --ignore=app/tests/test_websocket.py \
          --ignore=app/tests/test_auth.py

  integration-tests:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest
    - run: |
        python -m pytest app/tests/ \
          -v --tb=short \
          -k "not websocket and not auth" \
          --cov=app --cov-append --cov-report=term
