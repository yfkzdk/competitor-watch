name: 快速测试

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  quick-test:
    name: 快速测试
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置Python环境
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: 运行快速测试
      run: |
        python -m pytest app/tests/ \
          -v \
          --tb=short \
          --cov=app \
          --cov-report=term \
          -m "not slow" \
          --ignore=app/tests/test_websocket.py

    - name: 代码格式检查
      run: |
        pip install ruff
        ruff check app/ --diff || true

    - name: 验证依赖安全
      run: |
        pip install safety
        safety check --bare || true
