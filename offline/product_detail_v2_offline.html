<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博监控 // 竞品详情</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <style>
/* ================================================
   CYBERWATCH // Shared Cyberpunk Theme Base
   ================================================ */

:root {
    --bg-void: #0a0a0f;
    --bg-panel: #0d0d18;
    --bg-panel-alt: #111122;
    --border-dim: #1a1a3e;
    --border-glow: #00fff0;
    --neon-cyan: #00fff0;
    --neon-magenta: #ff2a6d;
    --neon-amber: #f0e000;
    --neon-green: #05ffa1;
    --neon-purple: #b537f2;
    --text-primary: #e0e0ff;
    --text-dim: #6a6a8e;
    --text-data: #00fff0;
    --p0-color: #ff2a6d;
    --p1-color: #f0e000;
    --p2-color: #00fff0;
    --p3-color: #b537f2;
    --font-display: 'Rajdhani', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --glow-cyan: 0 0 10px rgba(0,255,240,.4), 0 0 40px rgba(0,255,240,.15);
    --glow-magenta: 0 0 10px rgba(255,42,109,.4), 0 0 40px rgba(255,42,109,.15);
    --glow-amber: 0 0 10px rgba(240,224,0,.4), 0 0 40px rgba(240,224,0,.15);
}

/* ===== RESET ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-display);
    background: var(--bg-void);
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
}

/* ===== CRT SCANLINES ===== */
body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,.08) 2px, rgba(0,0,0,.08) 4px
    );
    pointer-events: none;
    z-index: 9999;
}

/* ===== GLITCH BAR ===== */
@keyframes glitch-bar {
    0%, 90%, 100% { opacity: 0; transform: translateY(0); }
    92% { opacity: 1; transform: translateY(-2px); height: 3px; }
    94% { opacity: 1; transform: translateY(1px); height: 1px; }
    96% { opacity: 0; }
}
body::before {
    content: '';
    position: fixed;
    left: 0; right: 0; top: 30%;
    height: 2px;
    background: var(--neon-cyan);
    opacity: 0;
    z-index: 9998;
    animation: glitch-bar 8s infinite;
    pointer-events: none;
}

/* ===== TOPBAR ===== */
.cyber-topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: linear-gradient(180deg, rgba(0,255,240,.06) 0%, transparent 100%);
    border-bottom: 1px solid var(--border-dim);
    position: relative;
}
.cyber-topbar::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-magenta), transparent);
    opacity: .6;
}
.cyber-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}
.cyber-brand h1 {
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--neon-cyan);
    text-shadow: var(--glow-cyan);
}
.cyber-brand .version {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border-dim);
    padding: 2px 8px;
    border-radius: 2px;
}
.cyber-nav {
    display: flex;
    gap: 16px;
    align-items: center;
}
.cyber-nav a, .cyber-nav button {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: color .2s;
    background: none;
    border: none;
    cursor: pointer;
}
.cyber-nav a:hover, .cyber-nav button:hover {
    color: var(--neon-cyan);
    text-shadow: 0 0 8px rgba(0,255,240,.4);
}
.cyber-nav button.active {
    color: var(--neon-cyan);
    border-bottom: 2px solid var(--neon-cyan);
    padding-bottom: 2px;
}

/* ===== PANELS ===== */
.cyber-panel {
    background: var(--bg-panel);
    border: 1px solid var(--border-dim);
    overflow: hidden;
    position: relative;
    margin-bottom: 16px;
}
.cyber-panel:hover { border-color: rgba(0,255,240,.25); }
.cyber-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border-dim);
    background: linear-gradient(180deg, rgba(0,255,240,.04) 0%, transparent 100%);
}
.cyber-panel-title {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--neon-cyan);
}
.cyber-panel-body { padding: 16px 18px; }

/* ===== STAT CARDS ===== */
.cyber-stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 20px;
}
.cyber-stat-card {
    position: relative;
    background: var(--bg-panel);
    border: 1px solid var(--border-dim);
    padding: 20px 22px;
    overflow: hidden;
    transition: border-color .3s, box-shadow .3s;
}
.cyber-stat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 3px; height: 100%;
    background: var(--card-accent, var(--neon-cyan));
}
.cyber-stat-card:hover {
    border-color: var(--card-accent, var(--border-glow));
    box-shadow: 0 0 20px rgba(0,255,240,.08);
}
.cyber-stat-card .stat-label {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
}
.cyber-stat-card .stat-value {
    font-family: var(--font-mono);
    font-size: 36px;
    font-weight: 700;
    color: var(--card-accent, var(--text-data));
    text-shadow: 0 0 15px rgba(0,255,240,.3);
    line-height: 1;
}
.cyber-stat-card .stat-sub {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 6px;
}

/* ===== BUTTONS ===== */
.cyber-btn {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 8px 18px;
    background: transparent;
    color: var(--neon-cyan);
    border: 1px solid var(--neon-cyan);
    cursor: pointer;
    letter-spacing: 1px;
    transition: all .2s;
    text-decoration: none;
    display: inline-block;
}
.cyber-btn:hover {
    background: rgba(0,255,240,.1);
    box-shadow: 0 0 15px rgba(0,255,240,.25);
}
.cyber-btn-danger {
    color: var(--neon-magenta);
    border-color: var(--neon-magenta);
}
.cyber-btn-danger:hover {
    background: rgba(255,42,109,.1);
    box-shadow: 0 0 15px rgba(255,42,109,.25);
}
.cyber-btn-amber {
    color: var(--neon-amber);
    border-color: var(--neon-amber);
}
.cyber-btn-amber:hover {
    background: rgba(240,224,0,.1);
    box-shadow: 0 0 15px rgba(240,224,0,.25);
}

/* ===== TABLE ===== */
.cyber-table {
    width: 100%;
    border-collapse: collapse;
    font-family: var(--font-mono);
    font-size: 12px;
}
.cyber-table th {
    text-align: left;
    padding: 10px 12px;
    color: var(--neon-cyan);
    border-bottom: 1px solid var(--border-dim);
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    font-size: 11px;
}
.cyber-table td {
    padding: 10px 12px;
    border-bottom: 1px solid rgba(26,26,62,.4);
    color: var(--text-primary);
}
.cyber-table tr:hover td {
    background: rgba(0,255,240,.03);
}

/* ===== BADGES ===== */
.cyber-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 2px 10px;
    border: 1px solid;
    border-radius: 2px;
}
.cyber-badge-p0 { color: var(--p0-color); border-color: var(--p0-color); }
.cyber-badge-p1 { color: var(--p1-color); border-color: var(--p1-color); }
.cyber-badge-p2 { color: var(--p2-color); border-color: var(--p2-color); }
.cyber-badge-p3 { color: var(--p3-color); border-color: var(--p3-color); }
.cyber-badge-success { color: var(--neon-green); border-color: var(--neon-green); }
.cyber-badge-warning { color: var(--neon-amber); border-color: var(--neon-amber); }
.cyber-badge-error { color: var(--neon-magenta); border-color: var(--neon-magenta); }

/* ===== FORM ===== */
.cyber-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-void);
    border: 1px solid var(--border-dim);
    color: var(--text-data);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
}
.cyber-input:focus {
    border-color: var(--neon-cyan);
    box-shadow: 0 0 8px rgba(0,255,240,.15);
}
.cyber-select {
    width: 100%;
    padding: 8px 12px;
    background: var(--bg-void);
    border: 1px solid var(--border-dim);
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 13px;
    outline: none;
}
.cyber-label {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    display: block;
}

/* ===== MODAL ===== */
.cyber-modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 1000;
    justify-content: center;
    align-items: center;
}
.cyber-modal-overlay.active { display: flex; }
.cyber-modal {
    background: var(--bg-panel);
    border: 1px solid var(--neon-cyan);
    padding: 28px;
    width: 420px;
    max-width: 90vw;
    box-shadow: 0 0 40px rgba(0,255,240,.15);
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}
.cyber-modal::before {
    content: '';
    position: absolute;
    top: -2px; left: -2px; right: -2px; bottom: -2px;
    background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
    z-index: -1;
    opacity: .3;
    filter: blur(1px);
}
.cyber-modal-title {
    font-family: var(--font-mono);
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--neon-cyan);
    margin-bottom: 20px;
    text-transform: uppercase;
}
.cyber-modal-close {
    position: absolute;
    top: 12px; right: 16px;
    font-family: var(--font-mono);
    font-size: 18px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
}
.cyber-modal-close:hover { color: var(--neon-magenta); }

/* ===== TOAST ===== */
.cyber-toast-container {
    position: fixed;
    top: 16px; right: 16px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.cyber-toast {
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 18px;
    background: var(--bg-panel);
    border: 1px solid var(--neon-cyan);
    color: var(--text-primary);
    box-shadow: 0 0 20px rgba(0,255,240,.15);
    animation: toast-in .3s ease-out;
}
.cyber-toast.error { border-color: var(--neon-magenta); box-shadow: 0 0 20px rgba(255,42,109,.15); }
@keyframes toast-in { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateX(20px); } }

/* ===== EMPTY STATE ===== */
.cyber-empty {
    text-align: center;
    padding: 40px 0;
    color: var(--text-dim);
    font-size: 13px;
}

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg-void); }
::-webkit-scrollbar-thumb { background: var(--border-dim); border-radius: 2px; }

/* ===== GRID LAYOUTS ===== */
.cyber-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cyber-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.cyber-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

/* ===== COMPETITOR CARD ===== */
.cyber-comp-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-dim);
    padding: 20px;
    transition: border-color .2s, box-shadow .2s;
    position: relative;
}
.cyber-comp-card:hover {
    border-color: rgba(0,255,240,.3);
    box-shadow: 0 0 20px rgba(0,255,240,.06);
}
.cyber-comp-card .card-name {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--neon-cyan);
    margin-bottom: 4px;
}
.cyber-comp-card .card-url {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.cyber-comp-card .card-metrics {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 12px;
}
.cyber-comp-card .metric {
    display: flex;
    flex-direction: column;
}
.cyber-comp-card .metric .m-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
}
.cyber-comp-card .metric .m-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--text-data);
}
.cyber-comp-card .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 1024px) {
    .cyber-grid-4 { grid-template-columns: repeat(2, 1fr); }
    .cyber-grid-3 { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 640px) {
    .cyber-grid-4, .cyber-grid-3, .cyber-grid-2 { grid-template-columns: 1fr; }
    .cyber-stats-row { grid-template-columns: 1fr 1fr; }
    .cyber-topbar { flex-wrap: wrap; gap: 8px; padding: 10px 16px; }
}
@media (max-width: 480px) {
    .cyber-stats-row { grid-template-columns: 1fr; }
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
    body::before, body::after { display: none; }
}

/* ===== DATA PULSE ===== */
@keyframes data-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
.cyber-pulse { animation: data-pulse 1.5s ease-in-out; }

/* ===== NEON DIVIDER ===== */
.cyber-divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    opacity: .3;
    margin: 16px 0;
}

/* ===== HEADER RIGHT ===== */
.cyber-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}
.cyber-connection-status {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 2px;
    padding: 4px 10px;
    border: 1px solid var(--neon-magenta);
    color: var(--neon-magenta);
    border-radius: 2px;
}
.cyber-connection-status.connected {
    border-color: var(--neon-green);
    color: var(--neon-green);
    box-shadow: 0 0 8px rgba(5,255,161,.2);
}
.cyber-btn-sm {
    padding: 4px 12px;
    font-size: 11px;
}

/* ===== CHART CONTAINERS ===== */
.cyber-chart-container {
    background: var(--bg-panel);
    border: 1px solid var(--border-dim);
    padding: 16px;
    min-height: 300px;
}
.cyber-chart-container canvas {
    max-height: 280px;
}
.cyber-chart-title {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin: 0 0 12px 0;
}

/* ===== SEVERITY BADGES ===== */
.cyber-severity {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 2px;
    letter-spacing: 1px;
}
.sev-p1, .sev-p0 { color: var(--p0-color); border: 1px solid var(--p0-color); }
.sev-p2 { color: var(--p1-color); border: 1px solid var(--p1-color); }
.sev-p3, .sev-info { color: var(--p2-color); border: 1px solid var(--p2-color); }

/* ===== REPORT LIST ===== */
.cyber-report-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.cyber-report-item {
    background: var(--bg-panel-alt);
    border: 1px solid var(--border-dim);
    padding: 14px 18px;
    transition: border-color .2s;
}
.cyber-report-item:hover {
    border-color: rgba(0,255,240,.2);
}
.cyber-report-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
}
.cyber-report-title {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 700;
    color: var(--neon-cyan);
}
.cyber-report-summary {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    margin: 0 0 8px 0;
    line-height: 1.5;
}
.cyber-report-meta {
    display: flex;
    gap: 16px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
}
.cyber-empty-state {
    text-align: center;
    padding: 40px;
    color: var(--text-dim);
    font-family: var(--font-mono);
    font-size: 13px;
}
.cyber-error-msg {
    color: var(--neon-magenta);
    font-family: var(--font-mono);
    font-size: 12px;
    margin-top: 8px;
    padding: 8px;
    background: rgba(255,42,109,.1);
    border-left: 2px solid var(--neon-magenta);
}

/* ===== COMPETITOR CARD ENHANCED ===== */
.cyber-comp-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
}
.cyber-comp-card {
    background: var(--bg-panel);
    border: 1px solid var(--border-dim);
    padding: 20px;
    cursor: pointer;
    transition: border-color .2s, box-shadow .2s;
}
.cyber-comp-card:hover {
    border-color: rgba(0,255,240,.4);
    box-shadow: 0 0 20px rgba(0,255,240,.08);
}
.cyber-comp-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
}
.cyber-comp-name {
    font-family: var(--font-mono);
    font-size: 16px;
    font-weight: 700;
    color: var(--neon-cyan);
}
.cyber-comp-status {
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 2px;
    letter-spacing: 1px;
}
.cyber-comp-status.status-monitoring {
    color: var(--neon-green);
    border: 1px solid var(--neon-green);
}
.cyber-comp-status.status-paused {
    color: var(--text-dim);
    border: 1px solid var(--text-dim);
}
.cyber-comp-url {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.cyber-comp-metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}
.cyber-comp-metric-value {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 700;
    color: var(--text-data);
}
.cyber-comp-metric-label {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
}

/* ===== TOAST ===== */
.cyber-toast {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 3000;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 18px;
    background: var(--bg-panel);
    border: 1px solid var(--neon-cyan);
    color: var(--text-primary);
    box-shadow: 0 0 20px rgba(0,255,240,.15);
    animation: toast-in .3s ease-out;
}
.cyber-toast.error {
    border-color: var(--neon-magenta);
    box-shadow: 0 0 20px rgba(255,42,109,.15);
}

window.fetch = function(url, options) {
    const urlStr = typeof url === 'string' ? url : (url.url || String(url));
    const urlClean = urlStr.split("?")[0];

    // Exact match first
    if (__EMBEDDED__[urlStr]) {

            text: () => Promise.resolve(JSON.stringify(__EMBEDDED__[urlStr])),
        });
    }

const CC = {
    cyan: '#00fff0', magenta: '#ff2a6d', amber: '#f0e000', green: '#05ffa1',
    purple: '#b537f2', grid: 'rgba(26,26,62,.6)', tick: '#6a6a8e',
};

    responsive: true, maintainAspectRatio: false,
    animation: { duration: 600 },

function mergeOpts(base, override) {
    const out = { ...base };
    for (const k of Object.keys(override)) {
        if (override[k] && typeof override[k] === 'object' && !Array.isArray(override[k]))
            out[k] = mergeOpts(out[k] || {}, override[k]);
        else out[k] = override[k];
    }
    return out;
}

function simpleDiff(oldText, newText) {
    if (!oldText && !newText) return [];
    if (!oldText) return [{ type: 'added', text: String(newText) }];
    if (!newText) return [{ type: 'removed', text: String(oldText) }];
    const a = String(oldText), b = String(newText);
    const result = [];
    const maxLen = Math.max(a.length, b.length);
    let i = 0;
    while (i < maxLen && a[i] === b[i]) i++;
    const prefix = a.slice(0, i);
    if (prefix) result.push({ type: 'same', text: prefix });

    let jA = a.length - 1, jB = b.length - 1;
    while (jA >= i && jB >= i && a[jA] === b[jB]) { jA--; jB--; }
    if (i <= jA) result.push({ type: 'removed', text: a.slice(i, jA + 1) });
    if (i <= jB) result.push({ type: 'added', text: b.slice(i, jB + 1) });
    if (jA + 1 < a.length) result.push({ type: 'same', text: a.slice(jA + 1) });
    return result;
}

                    ]
                });
                showToast(`预测完成：${predictionDays.value}天后预估 ${formatNumber(predPrices[predPrices.length-1], 1)} CNY`, 'info');
            } catch (e) { showToast('预测失败', 'error'); }
            finally { predictionLoading.value = false; }
        };

        const corrColor = v => {
            if (v > 0.7) return 'rgba(5,255,161,.7)';
            if (v > 0.4) return 'rgba(5,255,161,.35)';
            if (v > 0) return 'rgba(5,255,161,.15)';
            if (v > -0.4) return 'rgba(255,42,109,.15)';
            return 'rgba(255,42,109,.5)';
        };

        // Freshness
        const updateFreshness = () => {
            if (!dataFreshness.value.lastUpdate) return;
            const diff = Math.floor((Date.now() - dataFreshness.value.lastUpdate) / 1000);
            if (diff < 60) {
                dataFreshness.value = { text: `${diff}秒前更新`, stale: false, lastUpdate: dataFreshness.value.lastUpdate };
            } else if (diff < 3600) {
                dataFreshness.value = { text: `${Math.floor(diff/60)}分钟前更新`, stale: diff > 300, lastUpdate: dataFreshness.value.lastUpdate };
            } else {
                dataFreshness.value = { text: `${Math.floor(diff/3600)}小时前更新`, stale: true, lastUpdate: dataFreshness.value.lastUpdate };
            }
        };

        // === Main load ===
        const loadData = async () => {
            loading.value = true;
            error.value = null;
            Object.keys(sectionStatus).forEach(k => { sectionStatus[k].error = null; });
            try {
                const u = new URLSearchParams(window.location.search);
                competitorId.value = parseInt(u.get('competitor_id')) || 1;
                // Restore tab from URL
                const urlTab = u.get('tab');
                if (urlTab && tabs.some(t => t.key === urlTab)) currentTab.value = urlTab;

                await Promise.all([fetchCompetitors(), fetchMatrix()]);
                const c = competitors.value.find(x => x.id === competitorId.value);
                if (c) competitorName.value = c.name;

                // Core data (all tabs need these)
                const fetches = [
                    fetchPriceHistory(), fetchSentiment(),
                    fetchSentimentTrend(), fetchChanges(), fetchKeywords(), fetchPosture()
                ];
                // Lazy: only fetch reviews if starting on reviews tab
                if (currentTab.value === 'reviews') {
                    fetches.push(fetchReviews());
                    loadedTabs.value.add('reviews');
                }
                await Promise.all(fetches);

                // Track freshness
                dataFreshness.value = { text: '刚刚更新', stale: false, lastUpdate: Date.now() };
                dataVersion.value++;
                if (freshnessTimer) clearInterval(freshnessTimer);
                freshnessTimer = setInterval(updateFreshness, 5000);
            } catch (e) {
                error.value = e.message;
            } finally {
                loading.value = false;
                await nextTick();
                await nextTick();
                if (currentTab.value === 'overview') renderOverview();
                else if (currentTab.value === 'price') renderPriceTab();
                else if (currentTab.value === 'reviews') renderReviewsTab();
                else if (currentTab.value === 'analytics') renderAnalyticsTab();
            }
        };

        // === WebSocket with real data consumption ===
        let socket = null;
        const connectWS = () => {
            try {
                const p = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                socket = new WebSocket(`${p}//${window.location.host}/ws/monitoring`);
                socket.onopen = () => {
                    wsConnected.value = true;
                    if (competitorId.value) socket.send(JSON.stringify({ action: 'subscribe', competitor_id: competitorId.value }));
                };
                socket.onmessage = (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        if (msg.type === 'competitor_update' && msg.competitor_id === competitorId.value && msg.data) {
                            // Merge real-time data
                            const d = msg.data;
                            if (d.latest_price && d.latest_price.price != null) {
                                const existing = priceData.value.find(p => p.recorded_at === d.latest_price.recorded_at);
                                if (!existing) {
                                    priceData.value = [...priceData.value.slice(-199), {
                                        price: d.latest_price.price,
                                        recorded_at: d.latest_price.recorded_at,
                                        product_name: d.latest_price.product_name || '',
                                    }];
                                    if (currentTab.value === 'overview' || currentTab.value === 'price') renderOverview();
                                }
                            }
                            if (d.latest_reviews && d.latest_reviews.length) {
                                const existingIds = new Set(reviews.value.map(r => r.id));
                                const newReviews = d.latest_reviews.filter(r => !existingIds.has(r.id));
                                if (newReviews.length) {
                                    reviews.value = [...newReviews, ...reviews.value].slice(0, 100);
                                }
                            }
                            if (d.sentiment_stats) {
                                sentimentDist.value = {
                                    positive: d.sentiment_stats.positive || 0,
                                    neutral: d.sentiment_stats.neutral || 0,
                                    negative: d.sentiment_stats.negative || 0,
                                };
                            }
                        }
                    } catch (e) { /* ignore malformed messages */ }
                };
                socket.onclose = () => { wsConnected.value = false; setTimeout(connectWS, 5000); };
                socket.onerror = () => { wsConnected.value = false; };
            } catch { wsConnected.value = false; }
        };

        onMounted(async () => {
            await loadData();
            connectWS();
            if (autoRefresh.value) startAutoRefresh();
        });
        onUnmounted(() => {
            if (socket) socket.close();
            stopAutoRefresh();
            if (freshnessTimer) clearInterval(freshnessTimer);
            Object.keys(charts).forEach(destroyChart);
        });

        return {
            tabs, currentTab, loading, error, competitorId, competitorName, competitors, timeRange,
            metrics, competitor, priceData, reviews, sentimentDist, sentimentTrend, changes, reports, keywords, matrixData,
            reviewFilter, filteredReviews, predictionDays, predictionLoading,
            autoRefresh, refreshInterval, wsConnected, notification,
            competitorSummaries, diffTimeline, anomalyList, correlationMatrix,
            trendArrow, trendText, sectionStatus,
            postureScores, postureVisible, postureColors,
            dataFreshness, dataVersion,
            formatNumber, formatTimestamp, trendLabel, getSentimentLabel, corrColor,
            switchTab, selectCompetitor, onCompetitorChange, setTimeRange, toggleAutoRefresh, predictPrice, loadData,
            renderPostureRadar,
        };
    }
}).mount('#app');

</script>
</body>
</html>
